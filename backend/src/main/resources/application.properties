# ─────────────────────────────────────────────
# College ERP — Spring Boot Configuration
# ─────────────────────────────────────────────

# Server
server.port=8080

# ── Database (H2 In-Memory) ──────────
spring.datasource.url=jdbc:h2:mem:college_erp;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Initialize schema
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true

# ── JPA / Hibernate ───────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────
# Set JWT_SECRET env var in production. Never commit a real secret here.
jwt.secret=${JWT_SECRET:dev-only-change-in-production-min-32-chars!!}
jwt.expiration-ms=86400000

# ── Default seed passwords (override via env vars in production) ──
erp.default.admin-password=${ERP_ADMIN_PASSWORD:ChangeMe@Admin1}
erp.default.staff-password=${ERP_STAFF_PASSWORD:ChangeMe@Staff1}
erp.default.student-password=${ERP_STUDENT_PASSWORD:ChangeMe@Student1}

# ── File Upload (for student docs) ────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS ──────────────────────────────────────
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── Logging ───────────────────────────────────
logging.level.com.erp=INFO
logging.level.org.springframework.security=WARN
